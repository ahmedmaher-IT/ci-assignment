name: Day 2 CI

run-name: Day 2 CI - Triggered by @${{ github.actor }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python Version'
        required: true
        default: '3.13'
        type: choice
        options:
          - '3.12'
          - '3.13'
      create-package:
        description: 'Create Package'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 7 * * 1'

env:
  APP_NAME: temperature

permissions:
  contents: read

jobs:
  security-pre-build:
    name: Pre-Build Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ''

      - name: Run TruffleHog Scan (Docker)
        run: |
          docker run --rm -v "${{ github.workspace }}:/pwd" trufflesecurity/trufflehog:latest filesystem /pwd --only-verified

      - name: Run Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

  test:
    name: Run Tests
    needs: security-pre-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Pytest
        run: |
          mkdir -p reports
          pytest test_temperature.py -v --junitxml=reports/junit.xml

      - name: Notify on Failure
        if: failure()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "🚨 Tests failed on $BRANCH_NAME"

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/junit.xml
          retention-days: 5
          if-no-files-found: ignore

  package:
    name: Package App
    needs: test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create-package == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Version
        id: set_version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Tarball
        run: |
          mkdir -p dist
          tar -czf dist/temperature-${{ steps.set_version.outputs.version }}.tar.gz temperature.py

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/temperature-*.tar.gz
          if-no-files-found: error

  security-post-build:
    name: Post-Build Security Scan
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Run Trivy Scan on Artifact
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'dist/'
          severity: 'HIGH,CRITICAL'

  verify:
    name: Verify Package
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Verify Functionality
        run: |
          python3 -c "
          import glob, tarfile, sys
          tar_file = glob.glob('dist/*.tar.gz')[0]
          tar = tarfile.open(tar_file)
          tar.extractall('extracted')
          sys.path.insert(0, 'extracted')
          from temperature import celsius_to_fahrenheit as c
          assert c(100) == 212
          print('Package OK')
          "

  report:
    name: Generate Report
    needs: [test, package, security-pre-build, security-post-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SECRET: ${{ secrets.NOTIFY_TOKEN != '' }}
    steps:
      - name: Check Secret and Notify
        if: env.HAS_SECRET == 'true'
        env:
          TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          TOKEN_LEN=${#TOKEN}
          echo "Notification sent (token length: $TOKEN_LEN)"

      - name: Write Job Summary
        env:
          REPORT_TITLE: ${{ vars.REPORT_TITLE || 'DevSecOps Pipeline Report' }}
          VERSION_VAL: ${{ needs.package.result == 'success' && needs.package.outputs.version || 'n/a' }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_RES: ${{ needs.test.result }}
          PKG_RES: ${{ needs.package.result }}
        run: |
          SHORT_SHA=$(echo$COMMIT_SHA | cut -c1-7)
          echo "# $REPORT_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | ${{ env.APP_NAME }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Version | $VERSION_VAL \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | $SHORT_SHA \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Event Name | $EVENT_NAME \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Test Status | $TEST_RES \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Package Status | $PKG_RES \vert{}" >> $GITHUB_STEP_SUMMARY

  pr-comment:
    name: PR Comment Bot
    needs: package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.package.outputs.version }}';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ DevSecOps CI passed. Package version ${version} is secure and ready.`
            });